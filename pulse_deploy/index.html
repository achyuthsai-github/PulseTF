<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE · Supply chain control tower · Pulp Riot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#051C2C;--ink:#051C2C;--i2:#22364A;--i3:#56677A;--i4:#8794A3;--i5:#B5BEC9;--rule:#D6DCE3;--rule2:#E9EDF2;
  --bg:#F2F4F7;--panel:#FFFFFF;--blue:#2251FF;--cyan:#00A9F4;--pale:#E3EBFF;--act:#E0263B;--watch:#E88300;--ok:#2251FF;--teal:#00A19A;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --blink:1.2s;--hh:50px;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:12.5px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{display:grid;grid-template-columns:186px minmax(0,1fr);height:100vh}
/* sidebar */
.side{background:#fff;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{padding:14px 14px 10px;border-bottom:1px solid var(--rule2)}
.brand img{height:30px;width:auto;display:block}
.pmark{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 8px;border:1px solid var(--rule);border-left:4px solid var(--ok);cursor:pointer;background:#fff}
.pmark svg{flex:none}
.pmark b{font-family:var(--serif);font-size:17px;letter-spacing:.06em;line-height:1}
.pmark small{display:block;font-size:10.5px;color:var(--i3);margin-top:2px;line-height:1.25}
.pmark.st-watch{border-left-color:var(--watch)}.pmark.st-act{border-left-color:var(--act)}
.nav{display:flex;flex-direction:column;padding:8px 8px;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--i2);padding:7px 9px;cursor:pointer;text-align:left;font-size:12.5px;border-radius:2px}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="page"]{background:var(--navy);color:#fff}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .badge{margin-left:auto;font-size:10.5px;font-weight:600;border-radius:9px;padding:0 6px;background:var(--rule2);color:var(--i2)}
.nav .badge.act{background:var(--act);color:#fff}.nav .badge.watch{background:var(--watch);color:#fff}
.nav .sep{height:1px;background:var(--rule2);margin:6px 4px}
.side .foot{margin-top:auto;font-size:10.5px;color:var(--i3);padding:10px 14px;line-height:1.45;border-top:1px solid var(--rule2)}
.side .foot .prov{margin:2px 0}
/* header */
.main{display:grid;grid-template-rows:var(--hh) minmax(0,1fr);min-width:0;height:100vh}
header.top{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--rule);min-width:0}
.hc{display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-right:1px solid var(--rule2);min-width:0}
.hc label{font-size:10px;color:var(--i3);text-transform:none;letter-spacing:.01em}
.hc b{font-size:12.5px;font-weight:600;white-space:nowrap}
.hc select{border:0;background:transparent;font-weight:600;font-size:12.5px;padding:0;margin-left:-3px;cursor:pointer;max-width:190px}
.hc.grow{flex:1;border-right:0;align-items:flex-end;overflow:hidden}
.hc .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--i3);white-space:nowrap;overflow:hidden;max-width:100%}
.evb{border:1px solid var(--rule);background:#fff;font-size:12px;font-weight:600;padding:1px 8px;cursor:pointer;border-radius:2px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.evb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hbtn{align-self:center;margin-right:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:6px 11px;cursor:pointer;font-size:12px;display:flex;gap:7px;align-items:center;white-space:nowrap;border-radius:2px}
.hbtn.ghost{background:#fff;color:var(--navy)}
.hbtn b{background:#fff;color:var(--navy);border-radius:9px;padding:0 6px;font-size:11px}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.busy .dotlive{background:var(--watch);animation:blink .8s infinite}
/* page */
#page{min-height:0;overflow:hidden;padding:10px 14px 10px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:baseline;gap:14px;flex:none;min-width:0}
.ph h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;white-space:nowrap;letter-spacing:-.01em}
.ph .hl{font-size:12.5px;color:var(--i2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ph .hl b{color:var(--ink)}
.ph .rt{display:flex;gap:6px;align-items:center;flex:none}
.pg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.r2{grid-row:span 2}.r3{grid-row:span 3}
.card{background:#fff;border:1px solid var(--rule);border-top:2px solid var(--navy);display:flex;flex-direction:column;min-height:0;min-width:0;padding:6px 10px 8px}
.card.alert{border-top-color:var(--act)}
.ch{display:flex;align-items:center;gap:8px;flex:none;min-height:24px;min-width:0}
.ch h2{font-size:12.5px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ch h2 .go{cursor:pointer}.ch h2 .go:hover{text-decoration:underline}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.cb{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;min-width:0}
.fill{flex:1;min-height:0;position:relative;overflow:hidden;min-width:0}
.scroll{flex:1;min-height:0;overflow:auto}
/* KPI strips */
.kstrip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));flex:none;background:#fff;border:1px solid var(--rule)}
.ks{padding:6px 12px 7px 14px;border-left:1px solid var(--rule2);position:relative;min-width:0;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
.ks:first-child{border-left:0}
button.ks{cursor:pointer}button.ks:hover{background:#FAFBFC}
.ks::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--ok)}
.ks.st-watch::before{background:var(--watch)}.ks.st-act::before{background:var(--act)}.ks.st-none::before{background:var(--rule)}
.ks .n{font-size:11px;color:var(--i3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.ks .v{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
.ks .s{font-size:10.8px;color:var(--i3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks .sp{height:16px;margin-top:2px}
/* big KPI tiles (tower) */
.ktiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:none}
.kt{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--ok);padding:7px 12px 7px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto auto;column-gap:10px;min-width:0}
.kt:hover{background:#FAFBFC}
.kt.st-watch{border-top-color:var(--watch)}.kt.st-act{border-top-color:var(--act)}
.kt .t{font-size:11.5px;font-weight:600;color:var(--i2);grid-column:1/3;display:flex;align-items:center;gap:6px;white-space:nowrap}
.kt .t .chipst{margin-left:auto}
.kt .v{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.015em;white-space:nowrap}
.kt .d{align-self:end;font-size:11px;white-space:nowrap;text-align:right;padding-bottom:4px}
.kt .bul{grid-column:1/3;height:14px;margin:3px 0 2px}
.kt .f{grid-column:1/3;font-size:10.8px;color:var(--i3);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.kt .f span{overflow:hidden;text-overflow:ellipsis}
.up{color:var(--ok)}.dn{color:var(--act)}.flat{color:var(--i4)}
.chipst{font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;letter-spacing:.02em;white-space:nowrap}
.chipst.ok{color:var(--ok);background:var(--pale)}.chipst.watch{color:#9A5600;background:#FFF0DB}.chipst.act{color:#fff;background:var(--act)}
/* blinking (urgent only) */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}
.blink{animation:blink var(--blink) ease-in-out infinite}
body.noblink .blink{animation:none}
@media (prefers-reduced-motion:reduce){.blink{animation:none}*{transition:none!important}}
/* controls */
.btn{border:1px solid var(--rule);background:#fff;color:var(--ink);padding:4px 10px;cursor:pointer;font-size:12px;border-radius:2px;white-space:nowrap}
.btn:hover{border-color:var(--i4)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.acc{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.rej{color:var(--act);border-color:#F2B8C0}
.btn.sm{padding:1px 7px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{border:0;background:#fff;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--i2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sel{border:1px solid var(--rule);background:#fff;padding:1px 4px;font-size:11.5px;border-radius:2px;max-width:170px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--rule);background:#fff;border-radius:11px;padding:2px 9px;font-size:11.2px;cursor:pointer;white-space:nowrap;color:var(--i2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.red.on{background:var(--act);border-color:var(--act)}
.lbl{font-size:10.5px;color:var(--i3);white-space:nowrap}
/* legends, notes */
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:10.8px;color:var(--i3);flex:none;margin-top:3px}
.lg span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.lg i{width:14px;height:2.5px;background:var(--ink);display:inline-block}
.lg i.b{height:9px;width:9px}
.lg i.d{background:none;border-top:2px dashed var(--ink);height:0}
.note{font-size:10.8px;color:var(--i3);margin:3px 0 0;line-height:1.35;flex:none}
/* provenance */
.prov{display:inline-flex;align-items:center;gap:4px;font-size:10.3px;color:var(--i3);white-space:nowrap;font-weight:400}
.prov i{width:8px;height:8px;display:inline-block;border-radius:50%;flex:none}
.p-Actual i{background:var(--navy)}.p-Forecast i{border:1.5px solid var(--blue)}.p-Model i{background:linear-gradient(90deg,var(--navy) 50%,#fff 50%);border:1px solid var(--navy)}
.p-Simulated i{background:var(--cyan);border-radius:1px;transform:rotate(45deg) scale(.85)}.p-Assumption i{border:1.5px dashed var(--i4)}.p-Benchmark i{background:var(--i5)}
/* lists, tables, pills */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-weight:600;color:var(--i3);text-align:left;border-bottom:1.5px solid var(--navy);padding:3px 6px;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1;font-size:10.8px}
td{padding:3px 6px;border-bottom:1px solid var(--rule2);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F9FB}
.pill{font-size:10.3px;padding:1px 6px;border-radius:8px;background:var(--rule2);color:var(--i2);white-space:nowrap;font-weight:500}
.pill.ok{background:var(--pale);color:var(--ok)}.pill.watch{background:#FFF0DB;color:#9A5600}.pill.act{background:#FCE4E7;color:var(--act)}.pill.ink{background:var(--navy);color:#fff}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--rule2);font-size:11.5px;line-height:1.3}
.list li.click{cursor:pointer}.list li.click:hover{background:#F7F9FB}
.list .t{flex:1;min-width:0}.list .m{font-size:10.5px;color:var(--i3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;margin-top:4px;background:var(--ok)}
.d-watch{background:var(--watch)}.d-act{background:var(--act)}.d-ok{background:var(--ok)}.d-none{background:var(--i5)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.8px}
.empty{padding:14px;text-align:center;color:var(--i3);font-size:11.5px}
.mini2{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:0;border:1px solid var(--rule2);flex:none}
.mini2>div{padding:5px 8px;border-left:1px solid var(--rule2)}.mini2>div:first-child{border-left:0}
.mini2 .n{font-size:10.5px;color:var(--i3)}.mini2 .v{font-family:var(--serif);font-size:17px;font-weight:600}
/* svg text */
svg text{font-family:var(--sans)}
svg .ax{font-size:10.5px;fill:var(--i3)}
svg .lb{font-size:11px;fill:var(--i2)}
svg .vl{font-size:10.8px;fill:var(--ink);font-weight:600}
svg .hv{font-size:10.5px;font-weight:500}
svg .ml{font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
svg .ttl{font-size:10.5px;fill:var(--i3);font-weight:600;letter-spacing:.02em}
svg.arc .arcv{font-family:var(--serif);font-size:24px;font-weight:600;fill:var(--ink)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:#fff;border-left:1px solid var(--rule);box-shadow:-10px 0 30px rgba(5,28,44,.12);z-index:60;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:14px 18px 10px;border-bottom:2px solid var(--navy)}
.drawer h3{margin:0;font-family:var(--serif);font-size:18px}
.drawer small{color:var(--i3)}
.drawer .db{padding:12px 18px 30px;overflow-y:auto;flex:1}
.drawer .db h4{font-size:11.5px;margin:14px 0 6px;color:var(--i2);font-weight:600;border-bottom:1px solid var(--rule2);padding-bottom:3px}
.scrim{position:fixed;inset:0;background:rgba(5,28,44,.25);z-index:55;display:none}.scrim.on{display:block}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--i3);line-height:1;margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:11.8px;margin:0}
.kv dt{color:var(--i3)}.kv dd{margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.form .f{display:flex;flex-direction:column;gap:2px;min-width:0}
.form .f.w{grid-column:span 2}
.form label{font-size:10.5px;color:var(--i3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form input[type=number],.form select{border:1px solid var(--rule);border-radius:2px;padding:2px 6px;font-size:12px;width:100%;background:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:11.5px}
input[type=range]{accent-color:var(--navy)}
.dz{display:block;border:1.5px dashed var(--i4);padding:16px;text-align:center;color:var(--i3);cursor:pointer;background:#FAFBFC}
.issues{list-style:none;padding:0;margin:8px 0;font-size:12px}.issues li{padding:3px 0}.issues .error{color:var(--act)}.issues .warn{color:var(--watch)}
#tip{position:fixed;pointer-events:none;background:#fff;color:var(--ink);box-shadow:0 6px 22px rgba(5,28,44,.22);border:1px solid var(--rule);border-top:2px solid var(--navy);font-size:11.5px;padding:7px 9px;opacity:0;z-index:90;max-width:300px;line-height:1.4;transition:opacity .1s}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;font-size:12px;z-index:95;opacity:0;transition:opacity .2s;max-width:80vw;pointer-events:none}.toast.on{opacity:1}
/* events panel */
.evgrid{display:grid;grid-template-columns:1fr;gap:6px}
.evrow{border:1px solid var(--rule);padding:7px 9px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.evrow.on{border-color:var(--navy);background:#F7F9FB}
.evrow .ps{grid-column:2;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--i3)}
.evrow .ps select,.evrow .ps input{font-size:11px;border:1px solid var(--rule);padding:0 3px;max-width:120px}
/* replay */
.rp{display:flex;align-items:center;gap:8px;flex:none;font-size:11px;color:var(--i3);flex-wrap:nowrap;min-width:0}
.rp input[type=range]{flex:1;min-width:80px}
.rp b{color:var(--ink)}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;flex:none;border:1px solid var(--rule2);margin-top:4px}
.stages div{padding:3px 7px;border-left:1px solid var(--rule2);font-size:10.5px;color:var(--i3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages div:first-child{border-left:0}
.stages div b{display:block;font-size:11.5px;color:var(--ink)}
.stages div.hot{background:#FCE4E7}.stages div.hot b{color:var(--act)}.stages div.warm{background:#FFF4E5}
/* data tiles */
.dtiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
.dt{border:1px solid var(--rule2);padding:5px 7px;display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto 1fr;column-gap:7px;min-height:0;min-width:0}
.dt .ring{grid-row:1/3}
.dt .tt{font-size:11.2px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dt .q{grid-column:1/3;font-size:10.3px;color:var(--i3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}.dt .q b{color:var(--ink);font-weight:600}
.dt .mt{font-size:10.3px;color:var(--i3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .ac{grid-column:1/3;display:flex;gap:4px;align-self:end;margin-top:3px}
.dt .ac .btn{flex:1;padding:0 2px;font-size:10.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* report */
.rep-kpi td{padding:4px 6px}
/* fallback: small screens scroll instead of squeezing */
@media (max-height:700px),(max-width:1180px){
  #page{overflow:auto}
  .pg{flex:none;grid-template-rows:none!important;grid-auto-rows:minmax(280px,auto)}
  .r2,.r3{grid-row:span 1}
  .ktiles{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .ph .hl{white-space:normal}
}
@media (max-width:1180px){.c2,.c3,.c4,.c5{grid-column:span 6}.c6,.c7,.c8,.c9{grid-column:span 12}}
@media (max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.c2,.c3,.c4,.c5,.c6{grid-column:span 12}header.top{overflow-x:auto}}
@media print{.side,header.top,.drawer,.scrim{display:none}.shell{display:block}#page{overflow:visible}}
</style>
</head>
<body>

/* ---------- India network map (distribution & transport) ---------- */
function networkMap(host, R, o) {
  const nodes = Store.table("network_nodes"), nb = Object.fromEntries(nodes.map(n => [n.id, n])), risk = Object.fromEntries(R.distribution.depRisk.map(d => [d.depot, d]));
  const closureP = R.transport.corridorP["NH-306 hill highway"] || 0, routeRisk = closureP > .3 || R.supply.closure, ev = (R.sc || {}).ev || {};
  const links = [], flow = U.DEP.map((d, j) => U.sum(U.range(5).map(f => (o.alloc === "old" ? R.distribution.allocOld : R.distribution.allocAI)[f][j]))), maxF = Math.max(...flow);
  U.DEP.forEach((d, j) => { const src = SRC_OF(d), hw = ev.highway && nb[d].region === ev.highway.region;
    links.push({ from: nb[src], to: nb[d], width: o.mode === "flow" ? 1 + 7 * flow[j] / maxF : 1.4, color: hw ? C.act : o.mode === "flow" ? C.blue : C.i4, opacity: o.mode === "flow" ? .55 : .5, curve: .12, dash: hw ? "5 3" : "", blink: hw, tip: `${nb[src].name} → ${nb[d].name}<br>Next-week allocation ${fmt.k(flow[j])}${hw ? "<br><b style='color:" + C.act + "'>Outbound highway closed</b>" : ""}` }); });
  [["S_PF", "PLA"], ["S_PF", "PLB"]].forEach(([a, b]) => links.push({ from: nb[a], to: nb[b], color: routeRisk ? C.act : C.navy, width: 2.4, dash: routeRisk ? "6 3" : "", curve: .08, blink: !!R.supply.closure, tip: `<b>NH-306 hill highway</b><br>Passionfruit pulp · ${R.supply.closure ? "closed (simulated)" : "closure risk " + Math.round(closureP * 100) + "% (7 days)"}` }));
  if (routeRisk) links.push({ from: nb.A_AIR, to: nb.PLB, color: C.cyan, width: 1.6, dash: "2 3", curve: .2, tip: "Air bridge option via Lengpui (₹32.45/unit)" });
  links.push({ from: nb.S_DFI, to: nb.PLA, color: ev.importDelay ? C.watch : C.navy, width: 2, curve: .3, dash: ev.importDelay ? "5 3" : "", tip: "Imported dragonfruit · Nhava Sheva → Plant A" });
  ["S_DFD", "S_MANGO", "S_GUAVA1"].forEach(sid => links.push({ from: nb[sid], to: nb.PLA, color: ev.material && SUP_MAT[sid] === ev.material.mat ? C.watch : C.i4, width: 1.2, curve: .1 }));
  if (o.transfers) R.inventory.transfers.slice(0, 6).forEach(t => links.push({ from: nb[t.from], to: nb[t.to], color: C.navy, width: 2.2, dash: "1 4", curve: .35, arrow: true, tip: `Proposed transfer ${fmt.k(t.qty)} ${t.flavor}<br>${nb[t.from].name} → ${nb[t.to].name}<br>Value ${fmt.rsL(t.value)}` }));
  const nn = [];
  nodes.forEach(n => {
    if (n.kind === "depot") { const r = risk[n.id], rv = o.alloc === "old" ? r.riskOld : r.risk, col = rv > .05 ? C.act : rv > .02 ? C.watch : C.blue;
      nn.push({ ...n, labelLeft: ["MAA", "BOM"].includes(n.id) ? false : n.id === "BLR", r: 4.5 + 7 * Math.sqrt(U.sum(U.range(5).map(f => R.inventory.cell[f][U.DEP.indexOf(n.id)].p1)) / 1200), fill: col, halo: rv > .05 ? C.act : null, label: n.name, tip: `<b>${n.name}</b> · ${n.region}<br>Expected unserved ${fmt.pct(rv, 1)}<br>Cover ${(r.cover * 7).toFixed(1)} days<br>Contribution at risk ${fmt.rsL(r.cmRisk)}`, onClick: () => openDepot(n.id) }); }
    else if (n.kind === "plant" || n.kind === "copacker") { const out = (R.sc || {}).capOut && ("PL" + R.sc.capOut.plant) === n.id; nn.push({ ...n, r: 7, shape: "square", fill: out ? C.act : C.navy, halo: out ? C.act : null, label: n.kind === "copacker" ? null : n.name, labelLeft: n.id === "PLA", tip: `<b>${n.name}</b>${out ? "<br>Outage: " + Math.round(R.sc.capOut.cut * 100) + "% capacity lost" : ""}`, onClick: () => go("supply") }); }
    else if (n.kind === "airport") { if (routeRisk) nn.push({ ...n, r: 4, fill: "#fff", stroke: C.cyan, sw: 2, tip: "Lengpui airport (air option)" }); }
    else nn.push({ ...n, r: 6.5, shape: "tri", fill: n.id === "S_PF" && routeRisk ? C.act : C.i3, halo: n.id === "S_PF" && R.supply.closure ? C.act : null, label: n.id === "S_PF" ? "Passionfruit co-op" : null, tip: `<b>${n.name}</b>`, onClick: () => { const m = SUP_MAT[n.id]; if (m) openMaterial(m); } });
  });

    links.push({ from: a, to: b, color: "transparent", width: 0, curve: s.ln.mode === "sea" ? .3 : .12, dots: [{ t: prog, color: s.pLate > .3 ? C.act : s.pLate > .1 ? C.watch : C.navy, blink: s.pLate > .5, tip: `<b>${s.shipment}</b> ${s.item} · ${fmt.k(s.qty_k)}<br>${nb[s.origin].name} → ${nb[s.destination].name}<br>ETA P50 day ${s.p50.toFixed(1)} · P(late) ${fmt.pct(s.pLate)}`, onClick: () => openShipment(s) }] }); });
  mapChart(host, { links, nodes: nn });
}
function changesList(host, R, Ry, max = 10) {
  const ch = [];
  R.kpis.forEach(k => { const y = Ry.kpis.find(x => x.id === k.id); if (!y) return; const d = k.value - y.value; const rel = Math.abs(d) / Math.max(Math.abs(y.value), 1e-9); if (rel > 0.02 && KFMT[k.fmt](y.value) !== KFMT[k.fmt](k.value)) ch.push({ sev: (k.good === "down" ? d > 0 : d < 0) ? "watch" : "ok", text: `${k.name}: ${KFMT[k.fmt](y.value)} → ${KFMT[k.fmt](k.value)}`, mod: "KPI", w: rel }); });
  R.supply.materials.forEach((m, i) => { const y = Ry.supply.materials[i]; if (y && Math.abs(m.pDeplete - y.pDeplete) > .03) ch.push({ sev: m.pDeplete > y.pDeplete ? "act" : "ok", text: `${m.name}: chance of running out ${fmt.pct(y.pDeplete)} → ${fmt.pct(m.pDeplete)}`, mod: "Supply", w: 1 }); });
  R.transport.alerts.filter(a => a.day === App.cfg.asOfDay).forEach(a => ch.push({ sev: a.closure_prob_7d > .3 ? "act" : "watch", text: `${a.corridor}: ${a.message}`, mod: "Transport", w: 2 }));
  R.transport.ship.forEach(s => { const y = Ry.transport.ship.find(x => x.shipment === s.shipment); if (y && Math.abs(s.p50 - y.p50) > .7) ch.push({ sev: s.p50 > y.p50 ? "watch" : "ok", text: `${s.shipment} ${s.item}: ETA day ${y.p50.toFixed(0)} → ${s.p50.toFixed(0)}`, mod: "Transport", w: 1.5 }); });
  const yIds = new Set(Ry.recs.map(r => r.id)); R.recs.filter(r => !yIds.has(r.id)).forEach(r => ch.push({ sev: "watch", text: `New recommendation: ${r.title}`, mod: r.module, w: 1.2 }));
  const yE = new Set(Ry.spikes.map(e => e.week + e.flavor + e.region + e.cls)); R.spikes.filter(e => !yE.has(e.week + e.flavor + e.region + e.cls)).forEach(e => ch.push({ sev: e.cls === "Artificial" ? "watch" : "ok", text: `New ${e.cls.toLowerCase()} spike: ${e.flavor} ${e.region}`, mod: "Demand", w: 1 }));
  ch.sort((a, b) => b.w - a.w);
  const ul = H("ul", { class: "list" }, host);
  ch.slice(0, max).forEach(c => { const li = H("li", {}, ul); li.innerHTML = `<span class="dot d-${c.sev}"></span><div class="t">${c.text}</div><span class="m">${c.mod}</span>`; });
  if (!ch.length) H("div", { class: "empty" }, host, "No material changes since yesterday.");
}

      const prev = H("div", {}, area);

    }

}
